services:
  db:
    image: postgres:16-alpine
    container_name: split-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: split
    ports:
      - "5432:5432"
    volumes:
      - split-pgdata:/var/lib/postgresql/data

volumes:
  split-pgdata:
